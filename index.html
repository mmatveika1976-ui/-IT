dialog{width:min(760px,95vw)}#actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}#actions button{flex-grow:1}.primary{background:linear-gradient(#ffdb79,#d6a640);color:#132c4f;border:1px solid #ffedb7;border-radius:12px;padding:12px 18px;font-weight:bold}button:disabled{cursor:default;opacity:.5}#meter-label{font-size:14px;color:#ffdf93}progress{width:100%;height:12px;accent-color:#43d7b2;margin-bottom:20px}.levels{grid-template-columns:1fr}.level{white-space:pre-line;text-align:left;padding:20px;border-radius:15px;background:#173d61;color:#fff;border:1px solid #6e97b6;line-height:1.8}.level:disabled{opacity:.5}.word-grid{grid-template-columns:repeat(2,1fr)}.picture{font-size:62px;min-height:130px;background:#244e6d;border:2px solid #6388a2;border-radius:20px}.correct{background:#176958!important;border-color:#67e7b7!important;opacity:1!important}.wrong{background:#6b3349!important}.sound{margin-left:15px;border:1px solid #779eb8;border-radius:50%;background:#234b6d;color:white;padding:10px;font-size:20px}.sentence,.word-bank{display:flex;gap:8px;flex-wrap:wrap;min-height:74px;padding:14px;border:1px dashed #739abd;border-radius:14px;align-items:center}.sentence{background:#081e36}.sentence>span{color:#98b3cd;font-size:14px}.word-chip{padding:12px 16px;border-radius:10px;border:1px solid #91bdd8;background:#295476;color:#fff;font-size:20px}.needs-fix{border-color:#ffb077}.match-board{grid-template-columns:1fr 1fr;gap:24px!important}.match-column{display:grid;gap:10px}.match-word,.match-picture{min-height:68px;border-radius:12px;border:2px solid #6c97b1;background:#214969;color:white;font-size:20px}.match-picture{font-size:38px}.selected{border-color:#ffdd77;background:#48628a;box-shadow:0 0 0 2px #ffdd77}.results{background:#102e49;border:1px solid #5b819e;border-radius:16px;padding:20px}.results h3{font-size:28px;margin:0}.results li{margin:12px 0;line-height:1.4}.results ul{padding-left:22px}.phrase-board p{font-size:14px;color:#b8ccdf}.description{min-h <nav aria-label="Навигация"><a href="#games">✦ Игры</a><a href="#about">О коллекции</a></nav>
<main><h1><span>English</span> Adventures</h1><p class="ribbon">Первые слова · Настоящие приключения!</p>
<section class="book" id="games" aria-label="Выбери приключение">
<button class="card" data-game="treasure"><svg class="art" viewBox="260 325 350 350" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><image href="showcase-v2.png" width="1671" height="941"/></svg><span class="info"><span class="tag">01 · Vocabulary</span><h2>Treasure<br>Words</h2><span class="description" style="display:block">Исследуй остров и найди три сундука.</span><span class="play">▶ Play</span></span></button>
<button class="card" data-game="world"><svg class="art" viewBox="660 325 350 350" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><image href="showcase-v2.png" width="1671" height="941"/></svg><span class="info"><span class="tag">02 · Everyday English</span><h2>Travel<br>Talk</h2><span class="description" style="display:block">Угадай страну и собери пять открытий.</span><span class="play">▶ Play</span></span></button>
<button class="card" data-game="ocean"><svg class="art" viewBox="1070 325 350 350" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><image href="showcase-v2.png" width="1671" height="941"/></svg><span class="info"><span class="tag">03 · Animal words</span><h2>Ocean<br>Match</h2><span class="description" style="display:block">Найди пары морских обитателей.</span><span class="play">▶ Play</span></span></button>
</section><footer id="about">Английский с нуля: слова, короткие фразы и морские друзья.<br><br>9 уровней · Без таймера · Прогресс сохраняется в этом браузере</footer></main>
